[package]
name = "galaxia-ocr"
version = "0.1.0"
edition = "2021"
description = "Satellite OCR en Rust: extract_text con pdftotext, pdftoppm y Tesseract"
license = "MIT"
publish = false

[dependencies]
galaxia-provider-kit = { path = "../kit" }
galaxia-fhs = { workspace = true, features = ["ipfs"] }
imagesize = "0.13"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
